[package]
name = "elench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "An evidence layer for repositories — and the substrate that replaces git"

[[bin]]
name = "elench"
path = "src/main.rs"

[features]
default = []
# Forwards to elench-store's fjall-backend, enabling `--store fjall <path>`.
fjall-backend = ["elench-store/fjall-backend"]

[dependencies]
elench-claim = { path = "../elench-claim" }
elench-envelope = { path = "../elench-envelope" }
elench-store = { path = "../elench-store" }
elench-gate = { path = "../elench-gate" }
elench-predicate = { path = "../elench-predicate" }
elench-projection = { path = "../elench-projection" }
elench-anchor = { path = "../elench-anchor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "3.0.0"

[lints]
workspace = true
