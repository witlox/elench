name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUSTFLAGS: "-D warnings"

jobs:
  # Tier 1: fast unit tests + fmt-check + clippy. Runs on every push.
  tier-1:
    name: Tier 1 (fmt + clippy + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt-check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tier 1 tests
        run: make test

  # Tier 2: all targets including integration tests + fjall backend.
  # Runs on PRs. This is the merge gate.
  tier-2:
    name: Tier 2 (all-targets + fjall)
    needs: tier-1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tier 2 tests
        run: cargo test --all-targets
      - name: Tier 3 tests (fjall backend)
        run: cargo test --workspace --all-targets --features elench/fjall-backend
